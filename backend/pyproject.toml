[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexis-campus-api"
version = "0.1.0"
description = "FastAPI modular monolith for NEXIS Campus AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.12,<1.0",
  "python-docx>=1.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
